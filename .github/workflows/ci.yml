name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring
          coverage: none
          tools: composer:v2

      - name: Lint PHP
        run: find . -path ./.git -prune -o \( -name '*.php' -o -name '*.phtml' \) -print0 | xargs -0 -n1 php -l

      - name: Validate XML
        run: |
          sudo apt-get install -y -qq libxml2-utils > /dev/null
          find etc view -name '*.xml' -print0 | xargs -0 xmllint --noout

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      # The unit tests cover the classes without Magento calls, so no Magento install is needed.
      - name: Install PHPUnit and league/html-to-markdown
        run: |
          mkdir -p /tmp/agentready-ci
          composer --working-dir=/tmp/agentready-ci require --no-interaction --no-progress league/html-to-markdown:^5.2 phpunit/phpunit:^11.5

      - name: PHPUnit
        run: /tmp/agentready-ci/vendor/bin/phpunit
